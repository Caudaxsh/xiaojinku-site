<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cash Volcab</title>
  <meta name="description" content="個人專屬的英文單字複習 App：三級星等、間隔複習、離線可用。">
  <meta name="theme-color" content="#F3F2ED">
  <meta name="color-scheme" content="light">
  <!-- Pronunciation audio is loaded from other sites; sending no referrer keeps those requests from being refused. -->
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Cash Volcab">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" aria-live="polite"></main>
  <nav id="tabs" class="tabs" aria-label="主選單">
    <button data-tab="today" class="tab"><span data-icon="today" data-size="22"></span><span>今日</span></button>
    <button data-tab="library" class="tab"><span data-icon="book" data-size="22"></span><span>單字庫</span></button>
    <button data-tab="import" class="tab"><span data-icon="download" data-size="22"></span><span>匯入</span></button>
    <button data-tab="settings" class="tab"><span data-icon="settings" data-size="22"></span><span>設定</span></button>
  </nav>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="sheet" class="sheet" hidden></div>
  <noscript><p style="padding:24px">需要啟用 JavaScript 才能使用。</p></noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
