<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cash Volcab Pet</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .wrap { max-width: 960px; margin: 0 auto; padding: calc(var(--safe-top) + 24px) 16px 56px; }
    .head h1 { font: 700 28px/1.15 var(--serif); }
    .head p { color: var(--muted); font-size: 14px; margin-top: 6px; }
    .bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 18px 0; }
    .bar .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 12px; overflow: hidden; background: var(--paper); }
    .bar .seg button { min-height: 38px; padding: 0 14px; font-size: 14px; color: var(--slate); }
    .bar .seg button.on { background: var(--ink); color: var(--paper); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
    .cell { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 12px 12px 14px; display: grid; gap: 8px; justify-items: center; box-shadow: var(--shadow); }
    .cell .stagebox { position: relative; display: grid; place-items: end center; background: var(--paper-3); border-radius: 12px; width: 100%; padding: 8px 0 0; overflow: hidden; }
    .cell .stagebox .pet { position: relative; pointer-events: none; }
    .cell h3 { font: 650 14px/1.3 var(--sans); text-align: center; }
    .cell .meta { font-size: 12px; color: var(--muted); text-align: center; }
    .cell button.replay { min-height: 34px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-2); font-size: 13px; background: var(--paper); }
    .empty { text-align: center; padding: 40px 16px; color: var(--muted); }
    .sheetbox { margin-top: 26px; }
    .sheetbox img { image-rendering: pixelated; max-width: 100%; background: var(--paper-3); border-radius: 12px; border: 1px solid var(--line); }
    h2 { font: 650 15px var(--sans); margin: 30px 0 10px; letter-spacing: 0.06em; }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="head">
      <h1>寵物動作預覽</h1>
      <p id="sub">載入角色素材後，這裡會列出每一個動作（循環 / 播一次 / 靜態）。</p>
    </header>
    <div class="bar">
      <label class="btn" for="file">載入角色素材檔</label>
      <input id="file" type="file" accept="application/json,.json" hidden>
      <div class="seg" id="scale" role="group" aria-label="大小"></div>
      <div class="seg" id="mirror" role="group" aria-label="方向"></div>
      <a class="btn" href="./">回首頁</a>
    </div>
    <div id="out" class="grid"></div>
    <section class="sheetbox" id="sheetbox" hidden>
      <h2>Sprite Sheet（原圖）</h2>
      <img id="sheet" alt="sprite sheet">
    </section>
  </main>
  <script type="module">
    import { createStore } from './js/store.js';
    import { Sprite } from './js/pet/sprite.js';
    import { loadPack, readPackFile } from './js/pet/pack.js';

    const $ = (s) => document.querySelector(s);
    const state = { pack: null, scale: 2, flip: false, sprites: [] };

    const seg = (el, items, current, on) => {
      el.innerHTML = items.map(([v, label]) => `<button data-v="${v}" class="${String(current) === String(v) ? 'on' : ''}">${label}</button>`).join('');
      el.onclick = (e) => { const b = e.target.closest('button'); if (!b) return; on(b.dataset.v); seg(el, items, b.dataset.v, on); };
    };
    seg($('#scale'), [[1, '1×'], [2, '2×'], [3, '3×'], [4, '4×']], state.scale, (v) => { state.scale = Number(v); draw(); });
    seg($('#mirror'), [[0, '朝右'], [1, '朝左']], 0, (v) => { state.flip = v === '1'; draw(); });

    function draw() {
      state.sprites.forEach((s) => s.unmount());
      state.sprites = [];
      const { pack } = state;
      if (pack && !state.scaleSet) { state.scale = pack.scale || 2; state.scaleSet = true; seg($('#scale'), [[0.5, '0.5×'], [1, '1×'], [2, '2×'], [3, '3×']], state.scale, (v) => { state.scale = Number(v); draw(); }); }
      const out = $('#out');
      if (!pack) { out.innerHTML = '<div class="empty">還沒有角色素材。請按「載入角色素材檔」，或先到設定載入。</div>'; $('#sheetbox').hidden = true; return; }
      $('#sub').textContent = `${pack.name}・${pack.w}×${pack.h} 畫格・${pack.count} 張影格・${Object.keys(pack.clips).length} 組動作・預設放大 ${pack.scale}×`;
      const modeText = { loop: '循環', once: '播一次', hold: '靜態停留（可疊字）' };
      out.innerHTML = Object.entries(pack.clips).map(([name, c]) => {
        const ms = c.seq.reduce((n, [, t]) => n + t, 0);
        const frames = new Set(c.seq.map(([f]) => f)).size;
        return `<div class="cell" data-clip="${name}"><div class="stagebox"></div><h3>${c.label || name}</h3>
          <div class="meta">${name}・${modeText[c.mode]}・${frames} 張・${(ms / 1000).toFixed(2)} 秒${c.side ? '・側面' : ''}</div>
          <button class="replay">重播</button></div>`;
      }).join('');
      out.querySelectorAll('.cell').forEach((cell) => {
        const name = cell.dataset.clip;
        const sp = new Sprite(pack, { scale: state.scale }).mount(cell.querySelector('.stagebox'));
        const play = () => {
          sp.play(name, { flip: state.flip, onDone: () => setTimeout(play, 900) });
          if (name === 'card') sp.showCard('word');
        };
        play();
        cell.querySelector('.replay').onclick = play;
        state.sprites.push(sp);
      });
      $('#sheet').src = pack.sheet;
      $('#sheetbox').hidden = false;
    }

    (async () => {
      const store = await createStore();
      state.pack = await loadPack(store);
      draw();
      $('#file').addEventListener('change', async (e) => {
        try { state.pack = await readPackFile(e.target.files[0]); draw(); } catch (err) { $('#sub').textContent = `這不是有效的角色素材檔（${err.message}）`; }
        e.target.value = '';
      });
    })();
  </script>
</body>
</html>
